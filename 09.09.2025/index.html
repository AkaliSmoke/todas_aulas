<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicios CSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .texto-negrito {
            font-weight: 700;
        }
        .texto-italico {
            font-style: italic;
        }
        .sublinhado {
            text-decoration: underline;
        }

        #fundo {
            background-color: lightblue;
            width: 500px;
            height: 300px;
            text-align: center;
            align-content: center;
        }
        #imagem {
            background-image: url("il_570xN.6178221060_oruz.png");
            width: 500px;
            height: 500px;
            background-repeat: no-repeat;
            background-size: cover;
            opacity: 0.80;
        }
        body {
            background-image: url("30db87acf27ae6e6460d7f7b13caa63d.png");
            background-repeat: no-repeat;
            background-size: cover;
        }
    </style>
</head>
<body>
    <!-- Estilo para Texto -->
    <h1 class="texto-negrito">Texto em negrito</h1>
    <h1 class="texto-italico">Texto em itálico</h1>
    <h1 class="sublinhado texto-negrito texto-italico">Texto negrito, em itálico e sublinhado</h1>

    <!-- Estilo para fundo - background -->
    <section id="fundo">
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Eveniet eaque, ipsam quis dolore ullam atque a blanditiis beatae eos recusandae animi quod quaerat qui consequuntur quidem iste maxime aliquam eius?</p>
    </section>
     
    <section id="imagem">

    </section>


</body>
</html>
