<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color</title>
    <style>
        .caixa-azul {
            width: 400px;
            height: 400px;
            background-color: rgb(62, 62, 162);
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: end;
            padding: 20px;
            border: 5px ridge black;
            border-radius: 20px;
            gap: 10px;
        }
        button{
            width: 50px;
            height: 50px;
            border: 2px solid white;
            background-color: #5447F5;
            border-radius: 10px;
            flex: 3;
            align-self: flex-start;
        }
        button:hover {
            height: 50px;
            width: 50px;
            border: 2px solid white;
            background-color: #62ff00fd;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="caixa-azul">
        <button>Botão 1</button>
        <button>Botão 2</button>
        <button>Botão 3</button>





    </div>
</body>
</html>
