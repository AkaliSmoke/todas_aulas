<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <style>
        .container {
            align-items: center;
            text-align: center;
            margin: auto;
            background-color: cornflowerblue;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 350px;
            height: auto;
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>Pré-matrícula</h2>
        <form class="Formulário">
            <label for="nome">Nome do Aluno:</label>
            <input type="text" id="nome" name="nome" min="1" max="45" placeholder="Digite seu nome" required>
            <br>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" min="1" max="100">
            <br>
            <label for="nome">Nome da mãe:</label>
            <input type="text" id="nome" name="nome" min="1" max="45" placeholder="Digite o nome de sua mãe" required>
            <br>
            <label for="nome">Nome do pai:</label>
            <input type="text" id="nome" name="nome" min="1" max="45" placeholder="Digite o nome de seu pai" required>
            <br>
            <label for="phone">Telefone:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}">
            <br>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email">
            <br>
            <label for="Série">Série:</label>
            <select name="Série">
                <option value="1">Selecione</option>
                <option value="2">1 Ano da pré escola</option>
                <option value="3">2 Ano da pré escola</option>
                <option value="4">1 Ano do Ensino fundamental</option>
                <option value="5">2 Ano do Ensino fundamental</option>
                <option value="6">3 Ano do Ensino fundamental</option>
                <option value="7">4 Ano do Ensino fundamental</option>
                <option value="8">5 Ano do Ensino fundamental</option>
                <option value="9">6 Ano do Ensino fundamental</option>
                <option value="10">7 Ano do Ensino fundamental</option>
                <option value="11">8 Ano do Ensino fundamental</option>
                <option value="12">9 Ano do Ensino fundamental</option>
                <option value="13">1 Ano do Ensino médio</option>
                <option value="14">2 Ano do Ensino médio</option>
                <option value="15">3 Ano do Ensino médio</option>
            </select>
            </label>
            <br>
            <input type="radio" id="html" name="fav_language" value="HTML">
            <label for="html">Periodo da Manhã</label>
            <br>
            <input type="radio" id="css" name="fav_language" value="CSS">
            <label for="css">Periodo da Tarde</label>
            <br>
            <input type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
            <label for="vehicle1">Música</label><br>
            <input type="checkbox" id="vehicle2" name="vehicle2" value="Car">
            <label for="vehicle2">Ballet</label><br>
            <input type="checkbox" id="vehicle3" name="vehicle3" value="Boat">
            <label for="vehicle3">Pintura</label>
            <br>
            <input type="checkbox" id="vehicle2" name="vehicle2" value="Car">
            <label for="vehicle2">Judô</label>
            <br>
            <input type="checkbox" id="vehicle3" name="vehicle3" value="Boat">
            <label for="vehicle3">Futebol</label>
        </form>
    </div>
</body>
</html>
