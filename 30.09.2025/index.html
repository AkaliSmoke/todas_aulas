<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício Unidades</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{
        font-size: 20px;
    }

    .px-box {
        background-color: blanchedalmond;
        font-size: 40px;
        text-align: center;
    }

    .em-box {
        background-color: blanchedalmond;
        font-size: 3em;
        text-align: center;
    }

    .rem-box{
        background-color: blanchedalmond;
        font-size: 5rem;
        text-align: center;
    }

    .percent-container{
    width: 500px;
    height: 500px;
    font-size: 50px;
    background-color: aquamarine;
    }
 
    .percent-box{
    width: 50%;
    height: 50%;
    background-color: blueviolet;
    font-size: 50%;
    }
  </style>
</head>
<body>
  <h1>Exemplo com px, em e rem</h1>

<div class="px-box">Caixa com px</div>
  <div class="em-box">Caixa com em</div>
  <div class="rem-box">Caixa com rem</div>

    <div class="percent-container">
        <div class="percent-box">50% da largura</div>
    </div>
</body>
</html>
